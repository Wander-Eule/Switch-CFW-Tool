[config]
autoboot=0
autoboot_list=0
bootwait=3
backlight=100
autohosoff=1
autonogc=1
updater2p=1
bootprotect=0

[Atmosphere EmuMMC]
pkg3=atmosphere/package3
emummcforce=1
kip1=atmosphere/kips/*
secmon=atmosphere/exosphere.bin
icon=bootloader/res/icon_payload.bmp

[Atmosphere SysMMC]
pkg3=atmosphere/package3
emummc_force_disable=1
kip1=atmosphere/kips/*
secmon=atmosphere/exosphere.bin
icon=bootloader/res/icon_payload.bmp

[Stock sysMMC]
pkg3=atmosphere/package3
emummc_force_disable=1
stock=1
icon=bootloader/res/icon_switch.bmp
