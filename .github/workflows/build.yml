name: Build & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            archive: zip
          - os: ubuntu-latest
            rid: linux-x64
            archive: tar.gz
          - os: macos-latest
            rid: osx-arm64
            archive: tar.gz
          - os: macos-latest
            rid: osx-x64
            archive: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore & Publish
        run: >
          dotnet publish Switch-CFW-Tool.csproj
          -c Release
          -r ${{ matrix.rid }}
          -p:SelfContained=true
          -p:PublishSingleFile=true
          -o publish

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $stage = "stage/Switch CFW Tool"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item "publish/*" $stage -Recurse
          Copy-Item "LICENSE" $stage
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          Compress-Archive -Path $stage -DestinationPath "dist/Switch-CFW-Tool-${{ matrix.rid }}.zip"

      - name: Package (Linux / macOS)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p "stage/Switch CFW Tool" dist
          cp -R publish/* "stage/Switch CFW Tool/"
          cp LICENSE "stage/Switch CFW Tool/"
          chmod +x "stage/Switch CFW Tool/Switch-CFW-Tool"
          tar -czf "dist/Switch-CFW-Tool-${{ matrix.rid }}.tar.gz" -C stage "Switch CFW Tool"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Switch-CFW-Tool-${{ matrix.rid }}
          path: dist/*

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
