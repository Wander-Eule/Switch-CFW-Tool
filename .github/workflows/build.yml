name: Build & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            asset: Switch-CFW-Tool.exe
          - os: ubuntu-latest
            rid: linux-x64
            asset: Switch-CFW-Tool-linux-x64.tar.gz
          - os: macos-latest
            rid: osx-arm64
            asset: Switch-CFW-Tool-macos-arm64.tar.gz
          - os: macos-latest
            rid: osx-x64
            asset: Switch-CFW-Tool-macos-x64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore & Publish
        run: >
          dotnet publish Switch-CFW-Tool.csproj
          -c Release
          -r ${{ matrix.rid }}
          -p:SelfContained=true
          -p:PublishSingleFile=true
          -o publish

      # Windows ships as the bare .exe, the same single file earlier releases offered.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          Copy-Item "publish/Switch-CFW-Tool.exe" "dist/${{ matrix.asset }}"

      # Apple Silicon refuses to run an unsigned binary at all; an ad-hoc signature is enough
      # for it to start (Gatekeeper still asks once, see the README).
      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --sign - "publish/Switch-CFW-Tool"

      # A tarball keeps the executable bit, which a bare download would lose.
      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "stage/Switch CFW Tool" dist
          cp -R publish/* "stage/Switch CFW Tool/"
          cp LICENSE "stage/Switch CFW Tool/"
          chmod +x "stage/Switch CFW Tool/Switch-CFW-Tool"
          tar -czf "dist/${{ matrix.asset }}" -C stage "Switch CFW Tool"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Switch-CFW-Tool-${{ matrix.rid }}
          path: dist/*

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish Release
        # Pinned to the commit behind v2: this step can write to the repository.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Switch-CFW-Tool ${{ github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
